name: Android arm64 package

on:
  push:
    branches: [main, "impl/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-arm64:
    name: build-android-arm64
    runs-on: ubuntu-latest

    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-26
      ANDROID_NDK_VERSION: 27.0.12077973
      CMAKE_VERSION: 3.22.1
      PACKAGE_NAME: SimpleFPEWrapper-android-arm64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "platforms;${ANDROID_PLATFORM}"

      - name: Configure Android arm64 build
        run: |
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build Android arm64 binary
        run: cmake --build build/android-arm64 --target SimpleFPEWrapper -j "$(nproc)"

      - name: Package Android arm64 binary
        run: |
          set -euo pipefail
          package_dir="package/${PACKAGE_NAME}"
          mkdir -p "${package_dir}/lib/${ANDROID_ABI}" "dist"
          cp build/android-arm64/libSimpleFPEWrapper.so "${package_dir}/lib/${ANDROID_ABI}/"
          cat > "${package_dir}/README.txt" <<README
          SimpleFPEWrapper Android arm64 package

          ABI: ${ANDROID_ABI}
          Min Android API: ${ANDROID_PLATFORM#android-}
          Source revision: ${GITHUB_SHA}

          Copy lib/${ANDROID_ABI}/libSimpleFPEWrapper.so into your Android app or runtime package.
          README
          (cd package && zip -r "../dist/${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")

      - name: Upload workflow package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

      - name: Publish package on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PACKAGE_NAME }}.zip
